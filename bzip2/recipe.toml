[package]
name = "bzip2"
version = "1.0.8"
release = 1
desc = "High-quality block-sorting file compressor"
license = "bzip2-1.0.6"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://www.sourceware.org/pub/bzip2/bzip2-$VERSION.tar.gz", sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269" },
    { url = "https://www.linuxfromscratch.org/patches/lfs/12.3/bzip2-1.0.8-install_docs-1.patch", sha256 = "35e3bbd9642af51fef2a8a83afba040d272da42d7e3a251d8e43255a7b496702" },
]
patches = []

[build]
system = "raw"
steps = [
    "patch -Np1 -i bzip2-1.0.8-install_docs-1.patch || true",
    "sed -i 's@\\(ln -s -f \\)$(PREFIX)/bin/@\\1@' Makefile",
    "sed -i 's@(PREFIX)/man@(PREFIX)/share/man@g' Makefile",
    "make -f Makefile-libbz2_so",
    "make clean",
    "make",
    "make PREFIX=\"$DESTDIR/usr\" install",
    "cp -av libbz2.so.* \"$DESTDIR/usr/lib/\"",
    "ln -sv libbz2.so.1.0.8 \"$DESTDIR/usr/lib/libbz2.so\"",
    "cp -v bzip2-shared \"$DESTDIR/usr/bin/bzip2\"",
    "for i in bzcat bunzip2; do",
    "    ln -sfv bzip2 \"$DESTDIR/usr/bin/$i\"",
    "done",
    "rm -fv \"$DESTDIR/usr/lib/libbz2.a\"",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
