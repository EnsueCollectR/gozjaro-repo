[package]
name = "kmod"
version = "34"
release = 1
depends = ["openssl", "xz", "zstd", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-$VERSION.tar.xz", sha256 = "12e7884484151fbd432b6a520170ea185c159f4393c7a2c2a886ab820313149a" },
]
patches = []

[build]
system = "raw"
steps = [
    "# Stub out gtk-doc macros that aren't available in LFS",
    "mkdir -p m4",
    "cat > m4/gtk-doc.m4 <<'GTKM4'",
    "AC_DEFUN([GTK_DOC_CHECK],[",
    "  AM_CONDITIONAL([ENABLE_GTK_DOC],[false])",
    "  AM_CONDITIONAL([GTK_DOC_USE_LIBTOOL],[false])",
    "  AM_CONDITIONAL([GTK_DOC_USE_REBASE],[false])",
    "  AM_CONDITIONAL([GTK_DOC_BUILD_HTML],[false])",
    "  AM_CONDITIONAL([GTK_DOC_BUILD_PDF],[false])",
    "  AC_SUBST([GTKDOC_CHECK])",
    "  AC_SUBST([GTKDOC_CHECK_PATH])",
    "  AC_SUBST([GTKDOC_REBASE])",
    "  AC_SUBST([GTKDOC_MKPDF])",
    "])",
    "GTKM4",
    "install -Dm644 /dev/null libkmod/docs/gtk-doc.make 2>/dev/null || true",
    "sed -i '/^GTK_DOC_CHECK/d' configure.ac",
    "autoreconf -fi",
    "./configure --prefix=/usr --sysconfdir=/etc \\",
    "    --with-openssl --with-xz --with-zstd --with-zlib \\",
    "    --disable-manpages",
    "make ACLOCAL=: AUTOCONF=: AUTOMAKE=: AUTOHEADER=: MAKEINFO=:",
    "make ACLOCAL=: AUTOCONF=: AUTOMAKE=: AUTOHEADER=: MAKEINFO=: DESTDIR=\"$DESTDIR\" install",
    "for t in depmod insmod modinfo modprobe rmmod; do",
    "    ln -sfv ../bin/kmod \"$DESTDIR/usr/sbin/$t\"",
    "done",
    "ln -sfv kmod \"$DESTDIR/usr/bin/lsmod\"",
]

[install]
post = []
files = "auto"
backup = []
