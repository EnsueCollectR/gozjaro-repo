[package]
name = "mpc"
version = "1.3.1"
release = 1
desc = "C library for complex number arithmetic"
license = "LGPL-3.0-or-later"
depends = ["gmp", "mpfr"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/mpc/mpc-$VERSION.tar.gz", sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
