[package]
name = "kbd"
version = "2.7.1"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/utils/kbd/kbd-$VERSION.tar.xz", sha256 = "f167d899d92b56ccf12f6f49355173f93870a95f15d8aeebf5fdcd28a621aca8" },
    { url = "https://www.linuxfromscratch.org/patches/lfs/12.3/kbd-2.7.1-backspace-1.patch", sha256 = "8be28dcb11420624a500f2ea4fe975f771174bffee50e54ec8cd295a2dec104e" },
]
patches = []

[build]
system = "raw"
steps = [
    "patch -Np1 -i kbd-2.7.1-backspace-1.patch || true",
    "[ -f configure ] && sed -i '/RESIZECONS_PROGS=/s/yes/no/' configure || true",
    "./configure --prefix=/usr --disable-vlock",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
