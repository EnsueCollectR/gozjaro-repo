[package]
name = "libxcrypt"
version = "4.4.38"
release = 1
desc = "Extended crypt library for DES, MD5, Blowfish and others"
license = "LGPL-2.1-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/besser82/libxcrypt/releases/download/v$VERSION/libxcrypt-$VERSION.tar.xz", sha256 = "80304b9c306ea799327f01d9a7549bdb28317789182631f1b54f4511b4206dd6" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --enable-hashes=strong,glibc \\",
    "    --enable-obsolete-api=no \\",
    "    --disable-static \\",
    "    --disable-failure-tokens",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
