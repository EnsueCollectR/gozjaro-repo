[package]
name = "glibc"
version = "2.41"
release = 1
depends = ["linux-headers"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/glibc/glibc-$VERSION.tar.xz", sha256 = "a5a26b22f545d6b7d7b3dd828e11e428f24f4fac43c934fb071b6a7d0828e901" },
    { url = "https://www.linuxfromscratch.org/patches/lfs/12.3/glibc-2.41-fhs-1.patch", sha256 = "643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d" },
]
patches = []

[build]
system = "raw"
steps = [
    "patch -Np1 -i glibc-2.41-fhs-1.patch",
    "mkdir -v build && cd build",
    "echo \"rootsbindir=/usr/sbin\" > configparms",
    "../configure --prefix=/usr \\",
    "    --disable-werror \\",
    "    --enable-kernel=4.19 \\",
    "    --enable-stack-protector=strong \\",
    "    --disable-nscd \\",
    "    libc_cv_slibdir=/usr/lib",
    "make",
    "mkdir -pv \"$1/etc\"",
    "touch \"$1/etc/ld.so.conf\"",
    "sed '/test-installation/s@$(PERL)@echo not running@' -i ../Makefile",
    "make DESTDIR=\"$1\" install",
    "sed '/RTLDLIST=/s@/usr@@g' -i \"$1/usr/bin/ldd\"",
    "mkdir -pv \"$1/var/cache/nscd\"",
    "mkdir -pv \"$1/etc/ld.so.conf.d\"",
    "cat > \"$1/etc/ld.so.conf\" <<'CONF'",
    "/usr/local/lib",
    "/opt/lib",
    "include /etc/ld.so.conf.d/*.conf",
    "CONF",
]

[install]
post = []
files = "auto"
backup = []
