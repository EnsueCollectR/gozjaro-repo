[package]
name = "perl"
version = "5.40.1"
release = 1
depends = ["gdbm", "zlib", "bzip2"]
build_depends = []

[source]
urls = [
    { url = "https://www.cpan.org/src/5.0/perl-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "export BUILD_ZLIB=False",
    "export BUILD_BZIP2=0",
    "sh Configure -des \\",
    "    -Dprefix=/usr \\",
    "    -Dvendorprefix=/usr \\",
    "    -Dprivlib=/usr/lib/perl5/5.40/core_perl \\",
    "    -Darchlib=/usr/lib/perl5/5.40/core_perl \\",
    "    -Dsitelib=/usr/lib/perl5/5.40/site_perl \\",
    "    -Dsitearch=/usr/lib/perl5/5.40/site_perl \\",
    "    -Dvendorlib=/usr/lib/perl5/5.40/vendor_perl \\",
    "    -Dvendorarch=/usr/lib/perl5/5.40/vendor_perl \\",
    "    -Dman1dir=/usr/share/man/man1 \\",
    "    -Dman3dir=/usr/share/man/man3 \\",
    "    -Dpager=\"/usr/bin/less -isR\" \\",
    "    -Duseshrplib \\",
    "    -Dusethreads",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
