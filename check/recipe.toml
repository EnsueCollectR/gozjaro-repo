[package]
name = "check"
version = "0.15.2"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/libcheck/check/releases/download/$VERSION/check-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
