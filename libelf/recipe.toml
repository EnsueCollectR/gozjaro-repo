[package]
name = "libelf"
version = "0.192"
release = 1
desc = "ELF object file access library"
license = "LGPL-3.0-or-later"
depends = ["zlib"]
build_depends = []

[source]
urls = [
    { url = "https://sourceware.org/ftp/elfutils/$MAJOR.$MINOR/elfutils-$VERSION.tar.bz2", sha256 = "616099beae24aba11f9b63d86ca6cc8d566d968b802391334c91df54eab416b4" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy",
    "make -j$(nproc)",
    "make -j$(nproc) -C libelf DESTDIR=\"$DESTDIR\" install",
    "install -vm644 config/libelf.pc \"$DESTDIR/usr/lib/pkgconfig/\"",
    "rm -v \"$DESTDIR/usr/lib/libelf.a\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
