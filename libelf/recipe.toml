[package]
name = "libelf"
version = "0.192"
release = 1
desc = "ELF object file access library"
license = "LGPL-3.0-or-later"
depends = ["zlib"]
build_depends = []

[source]
urls = [
    { url = "https://sourceware.org/ftp/elfutils/$MAJOR.$MINOR/elfutils-$VERSION.tar.bz2", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy",
    "make",
    "make -C libelf DESTDIR=\"$1\" install",
    "install -vm644 config/libelf.pc \"$1/usr/lib/pkgconfig/\"",
    "rm -v \"$1/usr/lib/libelf.a\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
