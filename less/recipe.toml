[package]
name = "less"
version = "668"
release = 1
depends = ["ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/less/less-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --sysconfdir=/etc",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
