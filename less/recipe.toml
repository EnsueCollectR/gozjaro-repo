[package]
name = "less"
version = "668"
release = 1
depends = ["ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/less/less-$VERSION.tar.gz", sha256 = "2819f55564d86d542abbecafd82ff61e819a3eec967faa36cd3e68f1596a44b8" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --sysconfdir=/etc",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
