[package]
name = "procps-ng"
version = "4.0.5"
release = 1
depends = ["ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static --disable-kill",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
