[package]
name = "inetutils"
version = "2.6"
release = 1
depends = ["ncurses", "readline"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/inetutils/inetutils-$VERSION.tar.xz", sha256 = "68bedbfeaf73f7d86be2a7d99bcfbd4093d829f52770893919ae174c0b2357ca" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --bindir=/usr/bin \\",
    "    --localstatedir=/var \\",
    "    --disable-logger --disable-whois --disable-rcp \\",
    "    --disable-rexec --disable-rlogin --disable-rsh \\",
    "    --disable-servers",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
