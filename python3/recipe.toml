[package]
name = "python3"
version = "3.13.18"
release = 1
depends = ["zlib", "bzip2", "expat", "libffi", "ncurses", "readline", "openssl", "xz"]
build_depends = []

[source]
urls = [
    { url = "https://www.python.org/ftp/python/$VERSION/Python-$VERSION.tar.xz", sha256 = "abb0102e6d4ae027509bcb82327d9dd85515b44a3ba8ad538cfc5e9847029f68" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --enable-shared \\",
    "    --with-system-expat \\",
    "    --enable-optimizations",
    "make -j$(nproc)",
    "make DESTDIR=\"$DESTDIR\" install  # serial: parallel make install races on .pyc write",
]

[install]
post = []
files = "auto"
backup = []
