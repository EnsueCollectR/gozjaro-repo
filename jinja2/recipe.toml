[package]
name = "jinja2"
version = "3.1.5"
release = 1
depends = ["python3", "markupsafe"]
build_depends = []

[source]
urls = [
    { url = "https://pypi.org/packages/source/J/Jinja2/jinja2-$VERSION.tar.gz", sha256 = "8fefff8dc3034e27bb80d67c671eb8a9bc424c0ef4c0826edbff304cceff43bb" },
]
patches = []

[build]
system = "raw"
steps = [
    "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps \"$PWD\"",
    "pip3 install --no-index --no-user --find-links dist --root=\"$DESTDIR\" --prefix=/usr Jinja2",
]

[install]
post = []
files = "auto"
backup = []
