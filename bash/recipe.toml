[package]
name = "bash"
version = "5.2.37"
release = 1
depends = ["readline", "ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/bash/bash-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --without-bash-malloc \\",
    "    --with-installed-readline",
    "make",
    "make DESTDIR=\"$1\" install",
    "ln -sfv bash \"$1/bin/sh\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
