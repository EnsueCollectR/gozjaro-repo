[package]
name = "bash"
version = "5.2.37"
release = 1
depends = ["readline", "ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/bash/bash-$VERSION.tar.gz", sha256 = "9599b22ecd1d5787ad7d3b7bf0c59f312b3396d1e281175dd1f8a4014da621ff" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --without-bash-malloc \\",
    "    --with-installed-readline",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "ln -sfv bash \"$DESTDIR/bin/sh\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
