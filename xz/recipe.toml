[package]
name = "xz"
version = "5.6.4"
release = 1
desc = "XZ Utils compression tools"
license = "GPL-2.0-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/tukaani-project/xz/releases/download/vVERSION/xz-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
