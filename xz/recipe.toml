[package]
name = "xz"
version = "5.6.4"
release = 1
desc = "XZ Utils compression tools"
license = "GPL-2.0-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/tukaani-project/xz/releases/download/v$VERSION/xz-$VERSION.tar.xz", sha256 = "829ccfe79d769748f7557e7a4429a64d06858e27e1e362e25d01ab7b931d9c95" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
