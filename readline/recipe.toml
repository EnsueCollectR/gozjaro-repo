[package]
name = "readline"
version = "8.2.13"
release = 1
desc = "GNU Readline library"
license = "GPL-3.0-or-later"
depends = ["ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/readline/readline-$VERSION.tar.gz", sha256 = "0e5be4d2937e8bd9b7cd60d46721ce79f88a33415dd68c2d738fb5924638f656" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i '/MV.*old/d' Makefile.in",
    "sed -i '/{OLDSUFF}/c:' support/shlib-install",
    "sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf",
    "./configure --prefix=/usr --disable-static --with-curses",
    "make SHLIB_LIBS=\"-lncursesw\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
