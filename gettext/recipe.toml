[package]
name = "gettext"
version = "0.24"
release = 1
depends = ["acl", "ncurses", "libxcrypt"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/gettext/gettext-$VERSION.tar.xz", sha256 = "e1620d518b26d7d3b16ac570e5018206e8b0d725fb65c02d048397718b5cf318" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "chmod -v 0755 \"$DESTDIR/usr/lib/preloadable_libintl.so\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
