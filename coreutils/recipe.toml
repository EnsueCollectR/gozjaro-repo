[package]
name = "coreutils"
version = "9.6"
release = 1
depends = ["acl", "attr", "libcap"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/coreutils/coreutils-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr \\",
    "    --enable-no-install-program=kill,uptime",
    "make",
    "make DESTDIR=\"$1\" install",
    "mv -v \"$1/usr/bin/chroot\" \"$1/usr/sbin/\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
