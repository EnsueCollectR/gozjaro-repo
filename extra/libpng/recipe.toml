[package]
name = "libpng"
version = "1.6.47"
release = 1
desc = "A collection of routines used to create PNG format graphics"
license = "custom"
depends = ["zlib"]
build_depends = []

[source]
urls = [
    { url = "https://downloads.sourceforge.net/libpng/libpng-1.6.47.tar.xz" , sha256 = "b213cb381fbb1175327bd708a77aab708a05adde7b471bc267bd15ac99893631"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libpng (build + package)",
    "# source top dir \"libpng-1.6.47\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/libpng/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []
