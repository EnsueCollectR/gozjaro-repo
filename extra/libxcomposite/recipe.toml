[package]
name = "libxcomposite"
version = "0.4.6"
release = 1
desc = "X11 Composite extension library"
license = "MIT"
depends = ["libxfixes", "xorgproto"]
build_depends = []

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXcomposite-0.4.6.tar.xz", sha256 = "fe40bcf0ae1a09070eba24088a5eb9810efe57453779ec1e20a55080c6dc2c87" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXcomposite (build + package)",
    "# source top dir \"libXcomposite-0.4.6\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
