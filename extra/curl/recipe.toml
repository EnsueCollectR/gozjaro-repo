[package]
name = "curl"
version = "8.11.1"
release = 1
desc = "An URL retrieval utility and library"
license = "MIT"
depends = ["zlib", "openssl", "zstd", "brotli"]
build_depends = []

[source]
urls = [
    { url = "https://curl.se/download/curl-8.11.1.tar.xz" , sha256 = "c7ca7db48b0909743eaef34250da02c19bc61d4f1dcedd6603f109409536ab56"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD curl (build + package)",
    "# source top dir \"curl-8.11.1\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--disable-static \\",
    "--with-ssl \\",
    "--with-zlib \\",
    "--with-zstd \\",
    "--with-brotli \\",
    "--enable-ipv6 \\",
    "--disable-manual",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
