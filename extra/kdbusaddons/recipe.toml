[package]
name = "kdbusaddons"
version = "6.10.0"
release = 1
desc = "Addons to QtDBus"
license = "LGPL-2.1-or-later"
depends = ["qt6-base", "dbus"]
build_depends = ["cmake", "ninja", "extra-cmake-modules", "qt6-tools"]

[source]
urls = [
    { url = "https://download.kde.org/stable/frameworks/6.10/kdbusaddons-6.10.0.tar.xz" , sha256 = "e88bfaa6a10f80d9f7b2116281c4485213984caed555ac68557bb53ee88bbb32"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD kdbusaddons (build + package)",
    "# source top dir \"kdbusaddons-6.10.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DBUILD_TESTING=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
