[package]
name = "nettle"
version = "4.0"
release = 1
desc = "A low-level cryptographic library"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
depends = ["glibc", "gmp"]
build_depends = []

[source]
urls = [
    { url = "https://ftp.gnu.org/gnu/nettle/nettle-4.0.tar.gz" , sha256 = "3addbc00da01846b232fb3bc453538ea5468da43033f21bb345cb1e9073f5094"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD nettle (build + package)",
    "# source top dir \"nettle-4.0\" is stripped by the builder — paths below are flat",
    "",
    "cd .",
    "./configure --prefix=/usr \\",
    "--disable-static",
    "make",
    "",
    "",
    "cd .",
    "make DESTDIR=\"$DESTDIR/\" install",
]

[install]
post = []
files = "auto"
backup = []
