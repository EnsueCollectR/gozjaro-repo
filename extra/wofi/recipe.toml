[package]
name = "wofi"
version = "1.4.1"
release = 1
desc = "A launcher/menu program for wlroots based Wayland compositors"
license = "GPL-3.0-or-later"
depends = ["wayland", "gtk3", "glib2"]
build_depends = ["meson", "ninja", "gtk3"]

[source]
urls = [
    { url = "https://github.com/SimplyCEO/wofi/archive/refs/tags/v1.4.1.tar.gz" , sha256 = "815da56e9085e336bb31fbe7137f7db7a6c95db57274a93f6eeea995dee62656"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD wofi (build + package)",
    "# source top dir \"v1.4.1\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \"wofi-1.4.1\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
