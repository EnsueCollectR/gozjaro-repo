[package]
name = "libxslt"
version = "1.1.42"
release = 1
desc = "XML stylesheet transformation library"
license = "MIT"
depends = ["libxml2"]
build_depends = []

[source]
urls = [
    { url = "https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.42.tar.xz" , sha256 = "85ca62cac0d41fc77d3f6033da9df6fd73d20ea2fc18b0a3609ffb4110e1baeb"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libxslt (build + package)",
    "# source top dir \"libxslt-1.1.42\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--disable-static \\",
    "--without-python",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
