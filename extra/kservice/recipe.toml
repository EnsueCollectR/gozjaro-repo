[package]
name = "kservice"
version = "6.10.0"
release = 1
desc = "Advanced plugin and service introspection"
license = "LGPL-2.1-or-later"
depends = ["qt6-base", "kcoreaddons", "kconfig", "ki18n", "kdbusaddons"]
build_depends = ["cmake", "ninja", "extra-cmake-modules", "qt6-tools"]

[source]
urls = [
    { url = "https://download.kde.org/stable/frameworks/6.10/kservice-6.10.0.tar.xz" , sha256 = "04ad53850967e38822f8af1652b118992cd1bfa382e2718278bb6de03a0bdbb3"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD kservice (build + package)",
    "# source top dir \"kservice-6.10.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DBUILD_TESTING=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
