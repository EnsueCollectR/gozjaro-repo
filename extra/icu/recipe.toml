[package]
name = "icu"
version = "78.3"
release = 1
desc = "International Components for Unicode library"
license = "MIT"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz", sha256 = "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0" },
]
patches = []

[build]
steps = [
    "cd source",
    "./configure --prefix=/usr --sysconfdir=/etc --mandir=/usr/share/man --sbindir=/usr/bin",
    "make",
    "make DESTDIR=$DESTDIR install",
    "install -Dm644 ../LICENSE $DESTDIR/usr/share/licenses/icu/LICENSE",
]
