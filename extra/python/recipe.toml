[package]
name = "python"
version = "3.13.2"
release = 1
desc = "The Python programming language (3.x)"
license = "PSF-2.0"
depends = ["zlib", "openssl", "libffi", "bzip2", "xz", "sqlite"]
build_depends = []

[source]
urls = [
    { url = "https://www.python.org/ftp/python/3.13.2/Python-3.13.2.tar.xz" , sha256 = "d984bcc57cd67caab26f7def42e523b1c015bbc5dc07836cf4f0b63fa159eb56"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD python (build + package)",
    "# source top dir \"Python-3.13.2\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--enable-shared \\",
    "--enable-optimizations \\",
    "--with-lto \\",
    "--with-computed-gotos \\",
    "--with-system-ffi \\",
    "--enable-loadable-sqlite-extensions \\",
    "--without-ensurepip",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/python/LICENSE\"",
    "",
    "ln -sf python3 \"$DESTDIR/usr/bin/python\"",
    "ln -sf python3-config \"$DESTDIR/usr/bin/python-config\"",
]

[install]
post = []
files = "auto"
backup = []
