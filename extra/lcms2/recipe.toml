[package]
name = "lcms2"
version = "2.20"
release = 1
desc = "Small-footprint color management engine"
license = "MIT"
depends = ["libjpeg-turbo", "libtiff", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/mm2/Little-CMS/releases/download/lcms2.20/lcms2-2.20.tar.gz" , sha256 = "18ff5504fa9cc8a2b1f3591180d90ead16c8a2ea78e530523b46eab70e1ca6b9"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD lcms2 (build + package)",
    "# source top dir \"lcms2-2.20\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
