[package]
name = "libxinerama"
version = "1.1.5"
release = 1
desc = "X11 Xinerama extension library"
license = "MIT"
depends = ["libx11", "libxext", "xorgproto"]
build_depends = []

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXinerama-1.1.5.tar.xz", sha256 = "5094d1f0fcc1828cb1696d0d39d9e866ae32520c54d01f618f1a3c1e30c2085c" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXinerama (build + package)",
    "# source top dir \"libXinerama-1.1.5\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
