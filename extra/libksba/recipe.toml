[package]
name = "libksba"
version = "1.6.7"
release = 1
desc = "Library to make X.509 and CMS easy to use"
license = "GPL-3.0-or-later"
depends = ["libgpg-error"]
build_depends = []

[source]
urls = [
    { url = "https://gnupg.org/ftp/gcrypt/libksba/libksba-1.6.7.tar.bz2" , sha256 = "cf72510b8ebb4eb6693eef765749d83677a03c79291a311040a5bfd79baab763"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libksba (build + package)",
    "# source top dir \"libksba-1.6.7\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
