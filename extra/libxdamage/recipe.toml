[package]
name = "libxdamage"
version = "1.1.6"
release = 1
desc = "X11 damaged region extension library"
license = "MIT"
depends = ["libxfixes", "xorgproto"]
build_depends = []

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXdamage-1.1.6.tar.xz", sha256 = "52733c1f5262fca35f64e7d5060c6fcd81a880ba8e1e65c9621cf0727afb5d11" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXdamage (build + package)",
    "# source top dir \"libXdamage-1.1.6\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
