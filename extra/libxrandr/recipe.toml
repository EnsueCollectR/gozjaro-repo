[package]
name = "libxrandr"
version = "1.5.4"
release = 1
desc = "X11 RandR extension library"
license = "MIT"
depends = ["libxrender", "libxext"]
build_depends = ["xorgproto", "libxrender", "libxext"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXrandr-1.5.4.tar.xz", sha256 = "1ad5b065375f4a85915aa60611cc6407c060492a214d7f9daf214be752c3b4d3" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXrandr (build + package)",
    "# source top dir \"libXrandr-1.5.4\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
