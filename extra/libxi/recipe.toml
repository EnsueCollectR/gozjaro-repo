[package]
name = "libxi"
version = "1.8.2"
release = 1
desc = "X11 Input extension library"
license = "MIT"
depends = ["libxext", "libxfixes"]
build_depends = ["xorgproto", "libxext", "libxfixes"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXi-1.8.2.tar.xz", sha256 = "d0e0555e53d6e2114eabfa44226ba162d2708501a25e18d99cfb35c094c6c104" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXi (build + package)",
    "# source top dir \"libXi-1.8.2\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
