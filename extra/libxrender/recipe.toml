[package]
name = "libxrender"
version = "0.9.12"
release = 1
desc = "X Rendering Extension client library"
license = "MIT"
depends = ["libx11"]
build_depends = ["xorgproto", "libx11"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXrender-0.9.12.tar.xz", sha256 = "b832128da48b39c8d608224481743403ad1691bf4e554e4be9c174df171d1b97" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXrender (build + package)",
    "# source top dir \"libXrender-0.9.12\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
