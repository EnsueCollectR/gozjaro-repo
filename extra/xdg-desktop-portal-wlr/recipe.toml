[package]
name = "xdg-desktop-portal-wlr"
version = "0.7.1"
release = 1
desc = "xdg-desktop-portal backend for wlroots-based compositors"
license = "MIT"
depends = ["xdg-desktop-portal", "wlroots", "wayland", "pipewire"]
build_depends = ["meson", "ninja", "wayland-protocols", "scdoc"]

[source]
urls = [
    { url = "https://github.com/emersion/xdg-desktop-portal-wlr/releases/download/v0.7.1/xdg-desktop-portal-wlr-0.7.1.tar.gz" , sha256 = "eec6e4be808e1a445e677dba1e20e5acb2f091825f5ff4c6ac49d5843b2185f9"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xdg-desktop-portal-wlr (build + package)",
    "# source top dir \"xdg-desktop-portal-wlr-0.7.1\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dsd-bus-provider=libsystemd",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
