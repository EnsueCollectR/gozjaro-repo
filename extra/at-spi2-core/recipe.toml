[package]
name = "at-spi2-core"
version = "2.54.1"
release = 1
desc = "Protocol definitions and daemon for D-Bus at-spi"
license = "LGPL-2.1-or-later"
depends = ["glib2", "dbus", "libxi"]
build_depends = ["meson", "ninja", "glib2", "gobject-introspection"]

[source]
urls = [
    { url = "https://download.gnome.org/sources/at-spi2-core/2.54/at-spi2-core-2.54.1.tar.xz" , sha256 = "f0729e5c8765feb1969bb6c1fba18afa2582126b0359aa75a173fda1acf93c4c"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD at-spi2-core (build + package)",
    "# source top dir \"at-spi2-core-2.54.1\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--buildtype=release \\",
    "-Ddocs=false \\",
    "-Dintrospection=enabled \\",
    "-Dx11=enabled",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
