[package]
name = "libxext"
version = "1.3.6"
release = 1
desc = "X11 miscellaneous extensions library"
license = "MIT"
depends = ["libx11"]
build_depends = ["xorgproto", "libx11"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXext-1.3.6.tar.xz", sha256 = "edb59fa23994e405fdc5b400afdf5820ae6160b94f35e3dc3da4457a16e89753" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXext (build + package)",
    "# source top dir \"libXext-1.3.6\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
