[package]
name = "wayland-protocols"
version = "1.38"
release = 1
desc = "Wayland protocols that add functionality not available in the core protocol"
license = "MIT"
depends = ["wayland"]
build_depends = ["meson", "ninja", "wayland"]

[source]
urls = [
    { url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.38/downloads/wayland-protocols-1.38.tar.xz", sha256 = "ff17292c05159d2b20ce6cacfe42d7e31a28198fa1429a769b03af7c38581dbe" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD wayland-protocols (build + package)",
    "# source top dir \"wayland-protocols-1.38\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dtests=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
    "install -Dm644 \".COPYING\" \"$DESTDIR/usr/share/licenses/wayland-protocols/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
