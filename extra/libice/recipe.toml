[package]
name = "libice"
version = "1.1.2"
release = 1
desc = "X11 Inter-Client Exchange library"
license = "MIT"
depends = ["xorgproto"]
build_depends = []

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libICE-1.1.2.tar.xz", sha256 = "974e4ed414225eb3c716985df9709f4da8d22a67a2890066bc6dfc89ad298625" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libICE (build + package)",
    "# source top dir \"libICE-1.1.2\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
