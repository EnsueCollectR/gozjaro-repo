[package]
name = "garcon"
version = "4.20.0"
release = 1
desc = "Xfce menu library"
license = "LGPL-2.1-or-later"
depends = ["gtk3", "libxfce4ui"]
build_depends = ["meson", "ninja", "gtk3", "gobject-introspection"]

[source]
urls = [
    { url = "https://archive.xfce.org/src/xfce/garcon/4.20/garcon-4.20.0.tar.bz2" , sha256 = "7fb8517c12309ca4ddf8b42c34bc0c315e38ea077b5442bfcc4509415feada8f"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD garcon (build + package)",
    "# source top dir \"garcon-4.20.0\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dgtk-doc=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
