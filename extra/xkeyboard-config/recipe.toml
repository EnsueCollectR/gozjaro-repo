[package]
name = "xkeyboard-config"
version = "2.43"
release = 1
desc = "X keyboard configuration files"
license = "MIT"
depends = []
build_depends = ["meson", "ninja"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/data/xkeyboard-config/xkeyboard-config-2.43.tar.xz", sha256 = "c810f362c82a834ee89da81e34cd1452c99789339f46f6037f4b9e227dd06c01" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xkeyboard-config (build + package)",
    "# source top dir \"xkeyboard-config-2.43\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dxorg-rules-symlinks=true",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
