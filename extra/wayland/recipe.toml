[package]
name = "wayland"
version = "1.23.1"
release = 1
desc = "A computer display server protocol"
license = "MIT"
depends = ["libffi", "expat", "libxml2"]
build_depends = ["meson", "ninja", "libxml2"]

[source]
urls = [
    { url = "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz", sha256 = "864fb2a8399e2d0ec39d56e9d9b753c093775beadc6022ce81f441929a81e5ed" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD wayland (build + package)",
    "# source top dir \"wayland-1.23.1\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Ddocumentation=false \\",
    "-Dtests=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
    "install -Dm644 \".COPYING\" \"$DESTDIR/usr/share/licenses/wayland/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
