[package]
name = "xml-parser"
version = "2.47"
release = 1
depends = ["perl", "expat"]
build_depends = []

[source]
urls = [
    { url = "https://cpan.metacpan.org/authors/id/T/TO/TODDR/XML-Parser-$VERSION.tar.gz", sha256 = "ad4aae643ec784f489b956abe952432871a622d4e2b5c619e8855accbfc4d1d8" },
]
patches = []

[build]
system = "raw"
steps = [
    "perl Makefile.PL",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
