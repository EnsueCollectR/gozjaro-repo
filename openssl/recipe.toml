[package]
name = "openssl"
version = "3.4.1"
release = 1
desc = "TLS/SSL and crypto library"
license = "Apache-2.0"
depends = ["zlib", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/openssl/openssl/releases/download/openssl-$VERSION/openssl-$VERSION.tar.gz", sha256 = "002a2d6b30b58bf4bea46c43bdd96365aaf8daa6c428782aa4feee06da197df3" },
]
patches = []

[build]
system = "raw"
steps = [
    "./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic",
    "make",
    "sed -i '/INSTALL_LIBS/s/libcrypto.a libssl.a//' Makefile",
    "make DESTDIR=\"$1\" MANSUFFIX=ssl install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
