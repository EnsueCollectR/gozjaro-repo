[package]
name = "gdbm"
version = "1.26"
release = 1
desc = "GNU database library"
license = "GPL-3.0-or-later"
depends = ["readline"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/gdbm/gdbm-$VERSION.tar.gz", sha256 = "6a24504a14de4a744103dcb936be976df6fbe88ccff26065e54c1c47946f4a5e" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static --enable-libgdbm-compat",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
