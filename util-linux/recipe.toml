[package]
name = "util-linux"
version = "2.40.4"
release = 1
depends = ["ncurses", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/utils/util-linux/v$MAJOR.$MINOR/util-linux-$VERSION.tar.xz", sha256 = "5c1daf733b04e9859afdc3bd87cc481180ee0f88b5c0946b16fdec931975fb79" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --bindir=/usr/bin --libdir=/usr/lib --runstatedir=/run --sbindir=/usr/sbin \\",
    "    --disable-chfn-chsh --disable-login --disable-nologin --disable-su \\",
    "    --disable-setpriv --disable-runuser --disable-pylibmount --disable-static \\",
    "    --disable-liblastlog2 --without-python \\",
    "    ADJTIME_PATH=/var/lib/hwclock/adjtime",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
