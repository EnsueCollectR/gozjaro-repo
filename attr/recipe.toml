[package]
name = "attr"
version = "2.5.2"
release = 1
desc = "Extended attribute support library"
license = "LGPL-2.1-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://download.savannah.gnu.org/releases/attr/attr-$VERSION.tar.gz", sha256 = "39bf67452fa41d0948c2197601053f48b3d78a029389734332a6309a680c6c87" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static --sysconfdir=/etc",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
