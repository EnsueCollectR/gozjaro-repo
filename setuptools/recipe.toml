[package]
name = "setuptools"
version = "75.8.1"
release = 1
depends = ["python3", "wheel"]
build_depends = []

[source]
urls = [
    { url = "https://pypi.org/packages/source/s/setuptools/setuptools-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps \"$PWD\"",
    "pip3 install --no-index --find-links=dist --root=\"$1\" --prefix=/usr setuptools",
]

[install]
post = []
files = "auto"
backup = []
