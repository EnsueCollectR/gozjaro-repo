[package]
name = "libtool"
version = "2.5.4"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/libtool/libtool-$VERSION.tar.xz", sha256 = "f81f5860666b0bc7d84baddefa60d1cb9fa6fceb2398cc3baca6afaa60266675" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
    "rm -fv \"$DESTDIR/usr/lib/libltdl.a\"",
]

[install]
post = []
files = "auto"
backup = []
