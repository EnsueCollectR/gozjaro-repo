[package]
name = "libtool"
version = "2.5.4"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/libtool/libtool-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
    "rm -fv \"$1/usr/lib/libltdl.a\"",
]

[install]
post = []
files = "auto"
backup = []
