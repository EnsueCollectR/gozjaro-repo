[package]
name = "libcap"
version = "2.73"
release = 1
desc = "POSIX capabilities library"
license = "BSD-3-Clause"
depends = ["attr"]
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-$VERSION.tar.xz", sha256 = "6405f6089cf4cdd8c271540cd990654d78dd0b1989b2d9bda20f933a75a795a5" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i '/install -m.*STA/d' libcap/Makefile",
    "make prefix=/usr lib=lib",
    "make prefix=/usr lib=lib DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
