[package]
name = "vim"
version = "9.1.1166"
release = 1
depends = ["ncurses", "acl"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/vim/vim/archive/v$VERSION/vim-$VERSION.tar.gz", sha256 = "18543682cffe511407ef6a61af6df842d60232fad58c7c02544ae5860107e6be" },
]
patches = []

[build]
system = "raw"
steps = [
    "echo '#define SYS_VIMRC_FILE \"/etc/vimrc\"' >> src/feature.h",
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
    "ln -sv vim \"$DESTDIR/usr/bin/vi\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
