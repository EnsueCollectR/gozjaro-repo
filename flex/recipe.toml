[package]
name = "flex"
version = "2.6.4"
release = 1
depends = ["m4"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/westes/flex/releases/download/v$VERSION/flex-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make",
    "make DESTDIR=\"$1\" install",
    "ln -sv flex \"$1/usr/bin/lex\"",
]

[install]
post = []
files = "auto"
backup = []
