[package]
name = "dbus"
version = "1.14.10"
release = 1
depends = ["expat"]
build_depends = []

[source]
urls = [
    { url = "https://dbus.freedesktop.org/releases/dbus/dbus-$VERSION.tar.xz", sha256 = "ba1f21d2bd9d339da2d4aa8780c09df32fea87998b73da24f49ab9df1e36a50f" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \\",
    "    --runstatedir=/run --enable-user-session --disable-static \\",
    "    --disable-doxygen-docs --disable-xml-docs",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
