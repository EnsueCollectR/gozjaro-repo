[package]
name = "automake"
version = "1.17"
release = 1
depends = ["autoconf", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/automake/automake-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
