[package]
name = "automake"
version = "1.17"
release = 1
depends = ["autoconf", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/automake/automake-$VERSION.tar.xz", sha256 = "8920c1fc411e13b90bf704ef9db6f29d540e76d232cb3b2c9f4dc4cc599bd990" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
