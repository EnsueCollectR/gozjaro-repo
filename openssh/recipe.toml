[package]
name = "openssh"
version = "10.6p2"
release = 1
depends = ["openssl", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-$VERSION.tar.gz", sha256 = "9ae44872090cf2f06b3cf9ff147e7f16f309671340763ed2f99248398ae29d5b" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --sysconfdir=/etc/ssh \\",
    "    --with-privsep-path=/var/lib/sshd",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
