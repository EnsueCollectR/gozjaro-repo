[package]
name = "openssh"
version = "9.9p1"
release = 1
depends = ["openssl", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-$VERSION.tar.gz", sha256 = "b343fbcdbff87f15b1986e6e15d6d4fc9a7d36066be6b7fb507087ba8f966c02" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --sysconfdir=/etc/ssh \\",
    "    --with-privsep-path=/var/lib/sshd",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
