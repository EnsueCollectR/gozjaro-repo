[package]
name = "markupsafe"
version = "3.0.2"
release = 1
depends = ["python3"]
build_depends = []

[source]
urls = [
    { url = "https://pypi.org/packages/source/M/MarkupSafe/markupsafe-$VERSION.tar.gz", sha256 = "ee55d3edf80167e48ea11a923c7386f4669df67d7994554387f84e7d8b0a2bf0" },
]
patches = []

[build]
system = "raw"
steps = [
    "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps \"$PWD\"",
    "pip3 install --no-index --no-user --find-links dist --root=\"$1\" --prefix=/usr markupsafe",
]

[install]
post = []
files = "auto"
backup = []
