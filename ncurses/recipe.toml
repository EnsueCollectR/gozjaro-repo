[package]
name = "ncurses"
version = "6.6"
release = 1
desc = "Terminal handling library"
license = "MIT"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://invisible-mirror.net/archives/ncurses/ncurses-$VERSION.tar.gz", sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --mandir=/usr/share/man \\",
    "    --with-shared \\",
    "    --without-debug \\",
    "    --without-normal \\",
    "    --with-cxx-shared \\",
    "    --enable-pc-files \\",
    "    --with-pkg-config-libdir=/usr/lib/pkgconfig",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "ln -sfv libncursesw.so \"$DESTDIR/usr/lib/libncurses.so\"",
    "sed -e 's/^#if.*XOPEN.*$/#if 1/' -i \"$DESTDIR/usr/include/curses.h\"",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
