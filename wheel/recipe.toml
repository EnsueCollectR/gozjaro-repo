[package]
name = "wheel"
version = "0.45.1"
release = 1
depends = ["python3", "flit-core"]
build_depends = []

[source]
urls = [
    { url = "https://pypi.org/packages/source/w/wheel/wheel-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps \"$PWD\"",
    "pip3 install --no-index --find-links=dist --root=\"$1\" --prefix=/usr wheel",
]

[install]
post = []
files = "auto"
backup = []
