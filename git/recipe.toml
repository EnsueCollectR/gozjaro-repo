[package]
name = "git"
version = "2.48.1"
release = 1
depends = ["curl", "openssl", "zlib", "expat", "perl", "python3"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$VERSION.tar.xz", sha256 = "1c5d545f5dc1eb51e95d2c50d98fdf88b1a36ba1fa30e9ae5d5385c6024f82ad" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --with-gitconfig=/etc/gitconfig",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
