[package]
name = "bison"
version = "3.8.2"
release = 1
depends = ["m4"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/bison/bison-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
