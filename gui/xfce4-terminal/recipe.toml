[package]
name = "xfce4-terminal"
version = "1.1.3"
release = 1
desc = "A modern terminal emulator for Xfce"
license = "GPL-2.0-or-later"
depends = ["libxfce4ui", "vte3", "xfconf"]
build_depends = ["meson", "ninja", "gtk3", "vte3"]

[source]
urls = [
    { url = "https://archive.xfce.org/src/apps/xfce4-terminal/1.1/xfce4-terminal-1.1.3.tar.bz2" , sha256 = "214dd588d441b69f816009682a3bb4652cc19bed7ea64b612a12f097417b3d45"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xfce4-terminal (build + package)",
    "# source top dir \"xfce4-terminal-1.1.3\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
