[package]
name = "qt6-tools"
version = "6.8.2"
release = 1
desc = "Developer tools and other tools (Qt6)"
license = "GPL-3.0-or-later"
depends = ["qt6-base", "qt6-declarative"]
build_depends = ["cmake", "ninja", "qt6-base", "qt6-declarative"]

[source]
urls = [
    { url = "https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qttools-everywhere-src-6.8.2.tar.xz" , sha256 = "326381b7d43f07913612f291abc298ae79bd95382e2233abce982cff2b53d2c0"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD qt6-tools (build + package)",
    "# source top dir \"qttools-everywhere-src-6.8.2\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DQT_BUILD_TESTS=OFF \\",
    "-DQT_BUILD_EXAMPLES=OFF \\",
    "-DFEATURE_assistant=OFF \\",
    "-DFEATURE_designer=OFF \\",
    "-DFEATURE_linguist=ON",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
