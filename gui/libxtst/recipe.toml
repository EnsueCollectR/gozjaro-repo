[package]
name = "libxtst"
version = "1.2.5"
release = 1
desc = "X11 Testing -- Resource extension library"
license = "MIT"
depends = ["libx11", "libxext", "libxi", "xorgproto"]
build_depends = []

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/lib/libXtst-1.2.5.tar.xz", sha256 = "b50d4c25b97009a744706c1039c598f4d8e64910c9fde381994e1cae235d9242" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libXtst (build + package)",
    "# source top dir \"libXtst-1.2.5\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr --disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
