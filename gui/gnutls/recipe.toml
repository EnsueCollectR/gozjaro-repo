[package]
name = "gnutls"
version = "3.8.8"
release = 1
desc = "A library which provides a secure layer over a reliable transport layer"
license = "GPL-3.0-or-later"
depends = ["nettle", "libtasn1", "p11-kit", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.8.tar.xz" , sha256 = "ac4f020e583880b51380ed226e59033244bc536cad2623f2e26f5afa2939d8fb"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD gnutls (build + package)",
    "# source top dir \"gnutls-3.8.8\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--disable-static \\",
    "--disable-guile \\",
    "--disable-doc \\",
    "--disable-tests \\",
    "--with-included-unistring \\",
    "--without-idn",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
