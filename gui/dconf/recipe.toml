[package]
name = "dconf"
version = "0.40.0"
release = 1
desc = "A low level configuration system"
license = "LGPL-2.1-or-later"
depends = ["glib2", "dbus"]
build_depends = ["meson", "ninja", "vala", "gobject-introspection"]

[source]
urls = [
    { url = "https://download.gnome.org/sources/dconf/0.40/dconf-0.40.0.tar.xz" , sha256 = "cf7f22a4c9200421d8d3325c5c1b8b93a36843650c9f95d6451e20f0bcb24533"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD dconf (build + package)",
    "# source top dir \"dconf-0.40.0\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dman=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
