[package]
name = "nginx"
version = "1.26.2"
release = 1
desc = "Lightweight HTTP server and reverse proxy"
license = "BSD-2-Clause"
depends = ["pcre2", "zlib", "openssl"]
build_depends = []

[source]
urls = [
    { url = "https://nginx.org/download/nginx-1.26.2.tar.gz" , sha256 = "627fe086209bba80a2853a0add9d958d7ebbdffa1a8467a5784c9a6b4f03d738"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD nginx (build + package)",
    "# source top dir \"nginx-1.26.2\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/etc/nginx \\",
    "--sbin-path=/usr/bin/nginx \\",
    "--modules-path=/usr/lib/nginx/modules \\",
    "--conf-path=/etc/nginx/nginx.conf \\",
    "--error-log-path=stderr \\",
    "--pid-path=/run/nginx.pid \\",
    "--lock-path=/run/lock/nginx.lock \\",
    "--user=http \\",
    "--group=http \\",
    "--http-log-path=/var/log/nginx/access.log \\",
    "--http-client-body-temp-path=/var/lib/nginx/client-body \\",
    "--http-proxy-temp-path=/var/lib/nginx/proxy \\",
    "--http-fastcgi-temp-path=/var/lib/nginx/fastcgi \\",
    "--http-scgi-temp-path=/var/lib/nginx/scgi \\",
    "--http-uwsgi-temp-path=/var/lib/nginx/uwsgi \\",
    "--with-http_ssl_module \\",
    "--with-http_v2_module \\",
    "--with-http_gzip_static_module \\",
    "--with-http_stub_status_module \\",
    "--with-pcre-jit \\",
    "--with-threads",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/nginx/LICENSE\"",
    "",
    "install -dm755 \\",
    "\"$DESTDIR/var/lib/nginx/client-body\" \\",
    "\"$DESTDIR/var/lib/nginx/proxy\" \\",
    "\"$DESTDIR/var/lib/nginx/fastcgi\" \\",
    "\"$DESTDIR/var/lib/nginx/scgi\" \\",
    "\"$DESTDIR/var/lib/nginx/uwsgi\" \\",
    "\"$DESTDIR/var/log/nginx\"",
]

[install]
post = []
files = "auto"
backup = []
