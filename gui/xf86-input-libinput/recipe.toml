[package]
name = "xf86-input-libinput"
version = "1.4.0"
release = 1
desc = "X.org input driver based on libinput"
license = "MIT"
depends = ["libinput", "xorg-server"]
build_depends = ["xorgproto", "libinput", "xorg-server"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/driver/xf86-input-libinput-1.4.0.tar.xz", sha256 = "3a3d14cd895dc75b59ae2783b888031956a0bac7a1eff16d240dbb9d5df3e398" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xf86-input-libinput (build + package)",
    "# source top dir \"xf86-input-libinput-1.4.0\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
