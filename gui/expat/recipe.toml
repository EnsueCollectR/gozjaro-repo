[package]
name = "expat"
version = "2.6.4"
release = 1
desc = "XML parser library written in C"
license = "MIT"
depends = []
build_depends = ["cmake", "ninja"]

[source]
urls = [
    { url = "https://github.com/libexpat/libexpat/releases/download/R_2_6_4/expat-2.6.4.tar.xz" , sha256 = "a695629dae047055b37d50a0ff4776d1d45d0a4c842cf4ccee158441f55ff7ee"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD expat (build + package)",
    "# source top dir \"expat-2.6.4\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DEXPAT_BUILD_TESTS=OFF \\",
    "-DEXPAT_BUILD_EXAMPLES=OFF \\",
    "-DEXPAT_BUILD_DOCS=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
