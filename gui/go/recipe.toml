[package]
name = "go"
version = "1.23.6"
release = 1
desc = "Core compiler tools for the Go programming language"
license = "BSD-3-Clause"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://go.dev/dl/go1.23.6.linux-amd64.tar.gz", strip_topdir = false, sha256 = "9379441ea310de000f33a4dc767bd966e72ab2826270e038e78b2c53c2e7802d" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD go (build + package)",
    "# top dir \"go\" is KEPT (strip_topdir=false); cwd = extract root",
    "install -dm755 \"$DESTDIR/usr/lib/go\"",
    "cp -a go/. \"$DESTDIR/usr/lib/go/\"",
    "install -dm755 \"$DESTDIR/usr/bin\"",
    "ln -sf /usr/lib/go/bin/go \"$DESTDIR/usr/bin/go\"",
    "ln -sf /usr/lib/go/bin/gofmt \"$DESTDIR/usr/bin/gofmt\"",
    "install -Dm644 go/LICENSE \"$DESTDIR/usr/share/licenses/go/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []
