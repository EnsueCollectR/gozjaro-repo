[package]
name = "extra-cmake-modules"
version = "6.10.0"
release = 1
desc = "Extra modules and scripts for CMake (KDE)"
license = "BSD-2-Clause"
depends = ["cmake"]
build_depends = ["cmake", "ninja", "qt6-tools"]

[source]
urls = [
    { url = "https://download.kde.org/stable/frameworks/6.10/extra-cmake-modules-6.10.0.tar.xz" , sha256 = "506989a0d400913403e669c1912238db053cd6b38dff74b17e2e6f879c79cca0"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD extra-cmake-modules (build + package)",
    "# source top dir \"extra-cmake-modules-6.10.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DBUILD_TESTING=OFF \\",
    "-DBUILD_HTML_DOCS=OFF \\",
    "-DBUILD_MAN_DOCS=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
