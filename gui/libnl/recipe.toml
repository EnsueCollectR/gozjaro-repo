[package]
name = "libnl"
version = "3.11.0"
release = 1
desc = "Library for applications dealing with netlink sockets"
license = "LGPL-2.1-or-later"
depends = []
build_depends = ["flex", "bison"]

[source]
urls = [
    { url = "https://github.com/thom311/libnl/releases/download/libnl3_11_0/libnl-3.11.0.tar.gz" , sha256 = "2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libnl (build + package)",
    "# source top dir \"libnl-3.11.0\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--disable-static",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 COPYING \"$DESTDIR/usr/share/licenses/libnl/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
