[package]
name = "karchive"
version = "6.10.0"
release = 1
desc = "File compression"
license = "LGPL-2.1-or-later"
depends = ["qt6-base", "zlib", "bzip2", "xz"]
build_depends = ["cmake", "ninja", "extra-cmake-modules", "qt6-tools"]

[source]
urls = [
    { url = "https://download.kde.org/stable/frameworks/6.10/karchive-6.10.0.tar.xz" , sha256 = "ac5160c19dd110bbdadeba9c5355cbfd3b5c1bd00ce3dbdc4a085776698c8a48"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD karchive (build + package)",
    "# source top dir \"karchive-6.10.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DBUILD_TESTING=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
