[package]
name = "kcolorscheme"
version = "6.10.0"
release = 1
desc = "Classes for reading and interacting with KColorScheme"
license = "LGPL-2.1-or-later"
depends = ["qt6-base", "kconfig", "ki18n"]
build_depends = ["cmake", "ninja", "extra-cmake-modules"]

[source]
urls = [
    { url = "https://download.kde.org/stable/frameworks/6.10/kcolorscheme-6.10.0.tar.xz" , sha256 = "f070ed593f1d4010af5a56e247532be96a2c7ca9befc922b084c16215af79bdf"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD kcolorscheme (build + package)",
    "# source top dir \"kcolorscheme-6.10.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DBUILD_TESTING=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
