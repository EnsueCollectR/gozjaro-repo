[package]
name = "pixman"
version = "0.44.2"
release = 1
desc = "The pixel-manipulation library for X and cairo"
license = "MIT"
depends = []
build_depends = ["meson", "ninja"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/releases/individual/lib/pixman-0.44.2.tar.xz", sha256 = "50baf820dde0c5ff9714d03d2df4970f606a3d3b1024f5404c0398a9821cc4b0" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD pixman (build + package)",
    "# source top dir \"pixman-0.44.2\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dtests=disabled \\",
    "-Ddemos=disabled",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
