]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD nodejs (build + package)",
    "# source top dir \"node-v22.14.0-linux-x64\" is stripped by the builder — paths below are flat",
    "",
    "",
    "cd \".\"",
    "install -dm755 \"$DESTDIR/usr\"",
    "cp -a bin include lib share \"$DESTDIR/usr/\"",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/nodejs/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []
