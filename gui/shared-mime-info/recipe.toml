[package]
name = "shared-mime-info"
version = "2.4"
release = 1
desc = "Freedesktop.org Shared MIME Info"
license = "GPL-2.0-or-later"
depends = ["glib2"]
build_depends = ["meson", "ninja", "glib2", "itstool", "xmlto"]

[source]
urls = [
    { url = "https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.4/shared-mime-info-2.4.tar.gz", sha256 = "e24ffab8252128c991cd096c621a482e7c447b3bb14fa5e1a0627cef93f108e0" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD shared-mime-info (build + package)",
    "# source top dir \"shared-mime-info-2.4\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dupdate-mimedb=true",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
