[package]
name = "kiconthemes"
version = "6.10.0"
release = 1
desc = "Icon GUI utilities"
license = "LGPL-2.1-or-later"
depends = ["qt6-base", "qt6-svg", "kwidgetsaddons", "kcolorscheme", "kconfig", "kcoreaddons"]
build_depends = ["cmake", "ninja", "extra-cmake-modules", "qt6-tools"]

[source]
urls = [
    { url = "https://download.kde.org/stable/frameworks/6.10/kiconthemes-6.10.0.tar.xz" , sha256 = "15807e785183c048810af0141b3a560085f2bbf00f3a21fe962eb37a673f9314"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD kiconthemes (build + package)",
    "# source top dir \"kiconthemes-6.10.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DBUILD_TESTING=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
