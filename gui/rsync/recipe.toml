[package]
name = "rsync"
version = "3.5.2"
release = 1
desc = "A fast and versatile file copying tool for remote and local files"
license = "GPL-3.0-or-later"
depends = ["zlib", "openssl", "popt", "xxhash"]
build_depends = []

[source]
urls = [
    { url = "https://rsync.samba.org/ftp/rsync/rsync-3.5.2.tar.gz", sha256 = "a10d591825251e070f74c98df3daad195def4ed81b4a2de16169026aea33f6c8" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD rsync (build + package)",
    "# source top dir \"rsync-3.5.2\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--with-rsyncd-conf=/etc/rsyncd.conf \\",
    "--without-included-popt \\",
    "--without-included-zlib \\",
    "--disable-xxhash",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
