[package]
name = "swayidle"
version = "1.8.0"
release = 1
desc = "Idle management daemon for Wayland"
license = "MIT"
depends = ["wayland"]
build_depends = ["meson", "ninja", "wayland-protocols", "scdoc"]

[source]
urls = [
    { url = "https://github.com/swaywm/swayidle/releases/download/1.8.0/swayidle-1.8.0.tar.gz" , sha256 = "16b3e76a117f2f0ff2ee5fbebf38849595cdd705db1cd5f6aceaed00d71b3aa1"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD swayidle (build + package)",
    "# source top dir \"swayidle-1.8.0\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dman-pages=disabled \\",
    "-Dlogind=enabled \\",
    "-Dlogind-provider=systemd",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
