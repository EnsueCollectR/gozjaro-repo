[package]
name = "xwayland"
version = "24.1.6"
release = 1
desc = "Xorg server for running X11 applications under Wayland"
license = "MIT"
depends = ["libx11", "libxext", "libdrm", "wayland", "pixman", "mesa", "libxfixes", "libxrandr"]
build_depends = ["meson", "ninja", "wayland-protocols", "xorgproto", "libxkbcommon"]

[source]
urls = [
    { url = "https://xorg.freedesktop.org/archive/individual/xserver/xwayland-24.1.6.tar.xz", sha256 = "737e612ca36bbdf415a911644eb7592cf9389846847b47fa46dc705bd754d2d7" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xwayland (build + package)",
    "# source top dir \"xwayland-24.1.6\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dxwayland_eglstream=false \\",
    "-Dsha1=libgcrypt \\",
    "-Dipv6=true",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
