[package]
name = "libtiff"
version = "4.7.0"
release = 1
desc = "Library for manipulation of TIFF images"
license = "libtiff"
depends = ["zlib", "xz", "zstd", "libjpeg-turbo", "libwebp"]
build_depends = ["cmake", "ninja"]

[source]
urls = [
    { url = "https://download.osgeo.org/libtiff/tiff-4.7.0.tar.xz" , sha256 = "273a0a73b1f0bed640afee4a5df0337357ced5b53d3d5d1c405b936501f71017"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libtiff (build + package)",
    "# source top dir \"tiff-4.7.0\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-Dtiff-tests=OFF \\",
    "-Dtiff-docs=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
]

[install]
post = []
files = "auto"
backup = []
