[package]
name = "gnome-control-center"
version = "47.3"
release = 1
desc = "GNOME's main interface to configure various aspects of the desktop"
license = "GPL-2.0-or-later"
depends = ["gnome-desktop", "libadwaita", "gtk4", "networkmanager", "glib2"]
build_depends = ["meson", "ninja", "gobject-introspection"]

[source]
urls = [
    { url = "https://download.gnome.org/sources/gnome-control-center/47/gnome-control-center-47.3.tar.xz" , sha256 = "78381d5a7f1d5b297c9a19611145ee5e0584f06ac575ed08ad070a0c07bbeaa2"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD gnome-control-center (build + package)",
    "# source top dir \"gnome-control-center-47.3\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--buildtype=release \\",
    "-Ddocumentation=false \\",
    "-Dtests=false \\",
    "-Dsnap=false \\",
    "-Dflatpak=false \\",
    "-Dibus=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
