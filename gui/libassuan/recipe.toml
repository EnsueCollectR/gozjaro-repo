[package]
name = "libassuan"
version = "3.0.1"
release = 1
desc = "IPC library used by GnuPG and related software"
license = "GPL-3.0-or-later"
depends = ["libgpg-error"]
build_depends = []

[source]
urls = [
    { url = "https://gnupg.org/ftp/gcrypt/libassuan/libassuan-3.0.1.tar.bz2" , sha256 = "c8f0f42e6103dea4b1a6a483cb556654e97302c7465308f58363778f95f194b1"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD libassuan (build + package)",
    "# source top dir \"libassuan-3.0.1\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
