[package]
name = "htop"
version = "3.5.3"
release = 1
desc = "Interactive process viewer"
license = "GPL-2.0-or-later"
depends = ["ncurses"]
build_depends = ["ncurses"]

[source]
urls = [
    { url = "https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz", sha256 = "a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD htop (build + package)",
    "# source top dir \"htop-3.3.0\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--enable-unicode \\",
    "--enable-proc",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 COPYING \"$DESTDIR/usr/share/licenses/htop/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
