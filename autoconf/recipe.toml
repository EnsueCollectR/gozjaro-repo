[package]
name = "autoconf"
version = "2.72"
release = 1
depends = ["m4", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/autoconf/autoconf-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
