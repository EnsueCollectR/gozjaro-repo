[package]
name = "pkgconf"
version = "2.3.0"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://distfiles.ariadne.space/pkgconf/pkgconf-$VERSION.tar.xz", sha256 = "3a9080ac51d03615e7c1910a0a2a8df08424892b5f13b0628a204d3fcce0ea8b" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
    "ln -sv pkgconf \"$DESTDIR/usr/bin/pkg-config\"",
    "ln -sv pkgconf.1 \"$DESTDIR/usr/share/man/man1/pkg-config.1\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
