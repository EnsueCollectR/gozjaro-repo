[package]
name = "pkgconf"
version = "2.3.0"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://distfiles.ariadne.space/pkgconf/pkgconf-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make",
    "make DESTDIR=\"$1\" install",
    "ln -sv pkgconf \"$1/usr/bin/pkg-config\"",
    "ln -sv pkgconf.1 \"$1/usr/share/man/man1/pkg-config.1\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
