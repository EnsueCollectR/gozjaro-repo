[package]
name = "tar"
version = "1.35"
release = 1
depends = ["acl", "attr"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/tar/tar-$VERSION.tar.xz", sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16" },
]
patches = []

[build]
system = "raw"
steps = [
    "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
