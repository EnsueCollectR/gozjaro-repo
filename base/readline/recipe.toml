[package]
name = "readline"
version = "8.3"
release = 1
desc = "GNU Readline library"
license = "GPL-3.0-or-later"
depends = ["ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/readline/readline-$VERSION.tar.gz", sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i '/MV.*old/d' Makefile.in",
    "sed -i '/{OLDSUFF}/c:' support/shlib-install",
    "sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf",
    "./configure --prefix=/usr --disable-static --with-curses",
    "make -j$(nproc) SHLIB_LIBS=\"-lncursesw\"",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
