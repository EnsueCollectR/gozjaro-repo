[package]
name = "intltool"
version = "0.51.0"
release = 1
depends = ["perl", "xml-parser"]
build_depends = []

[source]
urls = [
    { url = "https://launchpad.net/intltool/trunk/$VERSION/+download/intltool-$VERSION.tar.gz", sha256 = "67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i 's:\\\\\\${:\\\\\\$\\\\{:' intltool-update.in",
    "./configure --prefix=/usr",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
