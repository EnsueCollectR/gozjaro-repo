[package]
name = "openssl"
version = "4.1.0"
release = 1
desc = "TLS/SSL and crypto library"
license = "Apache-2.0"
depends = ["zlib", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/openssl/openssl/archive/refs/tags/openssl-$VERSION.tar.gz", sha256 = "2a54158eb6861c07cefc92f1a1d68b12d5ecc0883d53c61a092995b221c7d5fe" },
]
patches = []

[build]
system = "raw"
steps = [
    "./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic",
    "make -j$(nproc)",
    "sed -i '/INSTALL_LIBS/s/libcrypto.a libssl.a//' Makefile",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" MANSUFFIX=ssl install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
