[package]
name = "libarchive"
version = "3.7.7"
release = 1
desc = "Multi-format archive and compression library"
license = "BSD-2-Clause"
depends = ["zlib", "bzip2", "xz", "zstd", "openssl"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/libarchive/libarchive/releases/download/v$VERSION/libarchive-$VERSION.tar.xz", sha256 = "879acd83c3399c7caaee73fe5f7418e06087ab2aaf40af3e99b9e29beb29faee" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
