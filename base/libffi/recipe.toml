[package]
name = "libffi"
version = "3.4.7"
release = 1
desc = "Foreign function interface library"
license = "MIT"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/libffi/libffi/releases/download/v$VERSION/libffi-$VERSION.tar.gz", sha256 = "138607dee268bdecf374adf9144c00e839e38541f75f24a1fcf18b78fda48b2d" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static --with-gcc-arch=native",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
