[package]
name = "file"
version = "5.46"
release = 1
depends = ["zlib"]
build_depends = []

[source]
urls = [
    { url = "https://astron.com/pub/file/file-$VERSION.tar.gz", sha256 = "c9cc77c7c560c543135edc555af609d5619dbef011997e988ce40a3d75d86088" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
