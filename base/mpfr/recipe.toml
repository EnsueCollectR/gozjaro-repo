[package]
name = "mpfr"
version = "4.2.1"
release = 1
desc = "Multiple-precision floating-point library"
license = "LGPL-3.0-or-later"
depends = ["gmp"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/mpfr/mpfr-$VERSION.tar.xz", sha256 = "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-static --enable-thread-safe",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
