[package]
name = "libxcrypt"
version = "4.5.2"
release = 1
desc = "Extended crypt library for DES, MD5, Blowfish and others"
license = "LGPL-2.1-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/besser82/libxcrypt/releases/download/v$VERSION/libxcrypt-$VERSION.tar.xz", sha256 = "71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071" },
]
patches = []

[build]
system = "raw"
steps = [
    "CFLAGS=-O2 -Wno-discarded-qualifiers ./configure --prefix=/usr \\",
    "    --enable-hashes=strong,glibc \\",
    "    --enable-obsolete-api=no \\",
    "    --disable-static \\",
    "    --disable-failure-tokens",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
