[package]
name = "rsync"
version = "3.4.1"
release = 1
depends = ["zlib", "openssl"]
build_depends = []

[source]
urls = [
    { url = "https://download.samba.org/pub/rsync/src/rsync-$VERSION.tar.gz", sha256 = "2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --without-included-zlib",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
