[package]
name = "gcc"
version = "16.2.0"
release = 1
depends = ["gmp", "mpfr", "mpc", "zlib", "binutils"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/gcc/gcc-$VERSION/gcc-$VERSION.tar.xz", sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e" },
]
patches = []

[build]
system = "raw"
steps = [
    "case $(uname -m) in",
    "    x86_64) sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64 ;;",
    "esac",
    "mkdir -v build && cd build",
    "../configure --prefix=/usr \\",
    "    LD=ld \\",
    "    --enable-languages=c,c++ \\",
    "    --enable-default-pie \\",
    "    --enable-default-ssp \\",
    "    --enable-host-pie \\",
    "    --disable-multilib \\",
    "    --disable-bootstrap \\",
    "    --disable-fixincludes \\",
    "    --with-system-zlib",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "find \"$DESTDIR\" -type f -size +1M -exec strip --strip-unneeded {} + 2>/dev/null || true",
    "ln -svr \"$DESTDIR/usr/bin/cpp\" \"$DESTDIR/usr/lib/\"",
    "mkdir -pv \"$DESTDIR/usr/share/gdb/auto-load/usr/lib\"",
    "mv -v \"$DESTDIR/usr/lib/\"*gdb.py \"$DESTDIR/usr/share/gdb/auto-load/usr/lib\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
