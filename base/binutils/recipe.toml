[package]
name = "binutils"
version = "2.47"
release = 1
depends = ["zlib"]
build_depends = []

[source]
urls = [
    { url = "https://sourceware.org/pub/binutils/releases/binutils-$VERSION.tar.xz", sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff" },
]
patches = []

[build]
system = "raw"
steps = [
    "mkdir -v build && cd build",
    "../configure --prefix=/usr \\",
    "    --sysconfdir=/etc \\",
    "    --enable-ld=default \\",
    "    --enable-plugins \\",
    "    --enable-shared \\",
    "    --disable-werror \\",
    "    --enable-64-bit-bfd \\",
    "    --enable-new-dtags \\",
    "    --with-system-zlib \\",
    "    --enable-default-hash-style=gnu",
    "make -j$(nproc) tooldir=/usr",
    "make -j$(nproc) tooldir=/usr DESTDIR=\"$DESTDIR\" install",
    "rm -fv \"$DESTDIR/usr/lib/lib\"{bfd,ctf,ctf-nobfd,opcodes,sframe}.a",
]

[install]
post = []
files = "auto"
backup = []
