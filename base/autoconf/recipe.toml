[package]
name = "autoconf"
version = "2.72"
release = 1
depends = ["m4", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/autoconf/autoconf-$VERSION.tar.xz", sha256 = "ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
