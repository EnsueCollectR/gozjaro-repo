[package]
name = "texinfo"
version = "7.2"
release = 1
depends = ["perl", "ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/texinfo/texinfo-$VERSION.tar.xz", sha256 = "0329d7788fbef113fa82cb80889ca197a344ce0df7646fe000974c5d714363a6" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
