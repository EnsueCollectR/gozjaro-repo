[package]
name = "libelf"
version = "0.195"
release = 1
desc = "ELF object file access library"
license = "LGPL-3.0-or-later"
depends = ["zlib"]
build_depends = []

[source]
urls = [
    { url = "https://sourceware.org/ftp/elfutils/$MAJOR.$MINOR/elfutils-$VERSION.tar.bz2", sha256 = "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy",
    "make -j$(nproc)",
    "make -j$(nproc) -C libelf DESTDIR=\"$DESTDIR\" install",
    "rm -v \"$DESTDIR/usr/lib/libelf.a\" 2>/dev/null || true",
    "install -d \"$DESTDIR/usr/lib/pkgconfig\"",
    "install -vm644 config/libelf.pc \"$DESTDIR/usr/lib/pkgconfig/\"",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
