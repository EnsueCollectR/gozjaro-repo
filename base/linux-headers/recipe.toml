[package]
name = "linux-headers"
version = "7.2.5"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/kernel/v7.x/linux-$VERSION.tar.xz", sha256 = "55ddf0df8325d9dad96fcff7bd93977d22e3f50af06527572af59b77c7632b78" },
]
patches = []

[build]
system = "raw"
steps = [
    "make -j$(nproc) mrproper",
    "make -j$(nproc) headers",
    "find usr/include -type f ! -name '*.h' -delete",
    "cp -rv usr/include \"$DESTDIR/usr/\"",
]

[install]
post = []
files = "auto"
backup = []
