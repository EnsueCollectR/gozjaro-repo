[package]
name = "bash"
version = "5.3"
release = 1
depends = ["readline", "ncurses"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/bash/bash-$VERSION.tar.gz", sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --without-bash-malloc \\",
    "    --with-installed-readline",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "ln -sfv bash \"$DESTDIR/bin/sh\" 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
