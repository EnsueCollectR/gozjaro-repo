[package]
name = "python3"
version = "3.14.10"
release = 1
depends = ["zlib", "bzip2", "expat", "libffi", "ncurses", "readline", "openssl", "xz"]
build_depends = []

[source]
urls = [
    { url = "https://www.python.org/ftp/python/$VERSION/Python-$VERSION.tar.xz", sha256 = "de414a57119abef52784d8993e341d53aed635fc2b05c2607d9f98a2c5b72032" },
]
patches = ["patches/python3-openssl4-version-methods.patch"]

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr \\",
    "    --enable-shared \\",
    "    --with-system-expat \\",
    "    --enable-optimizations",
    "make -j$(nproc)",
    "make DESTDIR=\"$DESTDIR\" install  # serial: parallel make install races on .pyc write",
]

[install]
post = []
files = "auto"
backup = []
