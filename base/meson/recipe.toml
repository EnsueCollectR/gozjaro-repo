[package]
name = "meson"
version = "1.12.1"
release = 1
depends = ["python3", "ninja", "jinja2", "markupsafe"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/mesonbuild/meson/releases/download/$VERSION/meson-$VERSION.tar.gz", sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743" },
]
patches = []

[build]
system = "raw"
steps = [
    "pip3 install --no-build-isolation --no-deps --root=\"$DESTDIR\" --prefix=/usr \"$PWD\"",
]

[install]
post = []
files = "auto"
backup = []
