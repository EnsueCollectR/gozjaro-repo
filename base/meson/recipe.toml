[package]
name = "meson"
version = "1.6.1"
release = 1
depends = ["python3", "ninja"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/mesonbuild/meson/releases/download/$VERSION/meson-$VERSION.tar.gz", sha256 = "1eca49eb6c26d58bbee67fd3337d8ef557c0804e30a6d16bfdf269db997464de" },
]
patches = []

[build]
system = "raw"
steps = [
    "pip3 install --no-build-isolation --no-deps --root=\"$DESTDIR\" --prefix=/usr \"$PWD\"",
]

[install]
post = []
files = "auto"
backup = []
