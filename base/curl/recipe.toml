[package]
name = "curl"
version = "8.20.0"
release = 1
desc = "Command-line URL transfer tool"
license = "MIT"
depends = ["openssl", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://curl.se/download/curl-$VERSION.tar.xz", sha256 = "63fe2dc148ba0ceae89922ef838f7e5c946272c2e78b7c59fab4b79d3ce2b896" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --with-openssl --enable-threaded-resolver --disable-static --without-libpsl",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
