[package]
name = "libpipeline"
version = "1.5.8"
release = 1
desc = "C library for manipulating pipelines of subprocesses"
license = "GPL-3.0-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://download.savannah.gnu.org/releases/libpipeline/libpipeline-$VERSION.tar.gz", sha256 = "1b1203ca152ccd63983c3f2112f7fe6fa5afd453218ede5153d1b31e11bb8405" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
