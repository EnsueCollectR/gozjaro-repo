[package]
name = "make"
version = "4.4.1"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/make/make-$VERSION.tar.gz", sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
