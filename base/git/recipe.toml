[package]
name = "git"
version = "2.54.0"
release = 1
depends = ["curl", "openssl", "zlib", "expat", "perl"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$VERSION.tar.xz", sha256 = "f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr --with-gitconfig=/etc/gitconfig",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "find \"$DESTDIR\" -type f -size +500k -exec strip --strip-unneeded {} + 2>/dev/null || true",
]

[install]
post = []
files = "auto"
backup = []
