[package]
name = "iproute2"
version = "6.13.0"
release = 1
depends = ["libelf"]
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-$VERSION.tar.xz", sha256 = "a43aa43338d882b44d01e549f3f105a92ae9feea32a82fae45a88e7a49302819" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i /ARPD/d Makefile",
    "rm -fv man/man8/arpd.8",
    "make -j$(nproc) NETNS_RUN_DIR=/run/netns",
    "make -j$(nproc) SBINDIR=/usr/sbin DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
