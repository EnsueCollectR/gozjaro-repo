[package]
name = "zlib"
version = "1.3.1"
release = 1
desc = "Compression library"
license = "Zlib"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://zlib.net/fossils/zlib-$VERSION.tar.gz", sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
    "rm -fv \"$1/usr/lib/libz.a\"",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
