[package]
name = "e2fsprogs"
version = "1.47.2"
release = 1
depends = ["util-linux"]
build_depends = []

[source]
urls = [
    { url = "https://downloads.sourceforge.net/project/e2fsprogs/e2fsprogs/v$VERSION/e2fsprogs-$VERSION.tar.gz", sha256 = "6dcd67ff9d8b13274ba3f088e4318be4f5b71412cd863524423fc49d39a6371f" },
]
patches = []

[build]
system = "raw"
steps = [
    "mkdir -v build && cd build",
    "../configure --prefix=/usr --sysconfdir=/etc --enable-elf-shlibs \\",
    "    --disable-libblkid --disable-libuuid --disable-uuidd --disable-fsck",
    "make",
    "make DESTDIR=\"$1\" install",
    "rm -fv \"$1/usr/lib/\"{libcom_err,libe2p,libext2fs,libss}.a",
]

[install]
post = []
files = "auto"
backup = []
