[package]
name = "libpipeline"
version = "1.5.8"
release = 1
desc = "C library for manipulating pipelines of subprocesses"
license = "GPL-3.0-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://download.savannah.gnu.org/releases/libpipeline/libpipeline-$VERSION.tar.gz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
