[package]
name = "gmp"
version = "6.3.0"
release = 1
desc = "GNU Multiple Precision Arithmetic Library"
license = "LGPL-3.0-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/gmp/gmp-$VERSION.tar.xz", sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898" },
]
patches = ["patches/gmp-gcc16-knr-longlong-test.patch"]

[build]
system = "raw"
steps = [
    "CC=gcc CXX=g++ ./configure --prefix=/usr --enable-cxx --disable-static",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "library"
