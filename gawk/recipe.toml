[package]
name = "gawk"
version = "5.3.1"
release = 1
depends = ["readline", "mpfr", "gmp"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/gawk/gawk-$VERSION.tar.xz", sha256 = "" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i 's/extras//' Makefile.in",
    "./configure --prefix=/usr",
    "make",
    "make DESTDIR=\"$1\" install",
]

[install]
post = []
files = "auto"
backup = []
