[package]
name = "systemd"
version = "256.11"
release = 1
depends = ["dbus", "kmod", "libcap", "acl", "xz", "zstd", "zlib", "bzip2", "openssl", "util-linux", "meson", "ninja"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/systemd/systemd/archive/v$VERSION/systemd-$VERSION.tar.gz", sha256 = "5038424744b2ed8c1d7ecc75b00eeffe68528f9789411da60f199d65762d9ba5" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i -e 's/want_tests != .no./false/' test/meson.build 2>/dev/null || true",
    "mkdir -v build && cd build",
    "meson setup .. \\",
    "    --prefix=/usr \\",
    "    --buildtype=release \\",
    "    --wrap-mode=nofallback \\",
    "    -Dmode=release \\",
    "    -Ddev-kvm-mode=0660 \\",
    "    -Dlink-udev-shared=true \\",
    "    -Dlogind=true \\",
    "    -Dvconsole=true \\",
    "    -Dhwdb=true \\",
    "    -Dsysusers=true \\",
    "    -Dtmpfiles=true \\",
    "    -Dtimedated=true \\",
    "    -Dlocaled=true \\",
    "    -Dhostnamed=true \\",
    "    -Dnetworkd=true \\",
    "    -Dresolve=true \\",
    "    -Dnss-myhostname=true \\",
    "    -Dnss-resolve=enabled \\",
    "    -Dnss-systemd=true \\",
    "    -Dmachined=false \\",
    "    -Dimportd=disabled \\",
    "    -Dhomed=disabled \\",
    "    -Dportabled=false \\",
    "    -Duserdb=false \\",
    "    -Doomd=false \\",
    "    -Dremote=disabled \\",
    "    -Dfirstboot=false \\",
    "    -Drandomseed=true \\",
    "    -Dbacklight=true \\",
    "    -Drfkill=true \\",
    "    -Dcoredump=true \\",
    "    -Dpstore=true \\",
    "    -Dpolkit=disabled \\",
    "    -Daudit=disabled \\",
    "    -Dpam=disabled \\",
    "    -Dapparmor=disabled \\",
    "    -Dselinux=disabled \\",
    "    -Dseccomp=disabled \\",
    "    -Dsmack=false \\",
    "    -Dxkbcommon=disabled \\",
    "    -Dpcre2=disabled \\",
    "    -Dglib=disabled \\",
    "    -Dgnutls=disabled \\",
    "    -Dopenssl=enabled \\",
    "    -Dcryptolib=openssl \\",
    "    -Dp11kit=disabled \\",
    "    -Dlibcurl=disabled \\",
    "    -Dlibidn2=disabled \\",
    "    -Dlibiptc=disabled \\",
    "    -Dqrencode=disabled \\",
    "    -Dgcrypt=disabled \\",
    "    -Dmicrohttpd=disabled \\",
    "    -Dpasswdqc=disabled \\",
    "    -Dpwquality=disabled \\",
    "    -Dxenctrl=disabled \\",
    "    -Dlz4=disabled \\",
    "    -Dzstd=enabled \\",
    "    -Dxz=enabled \\",
    "    -Dzlib=enabled \\",
    "    -Dbzip2=enabled \\",
    "    -Dbootloader=disabled \\",
    "    -Dukify=disabled \\",
    "    -Dkernel-install=true \\",
    "    -Danalyze=true \\",
    "    -Dtests=false \\",
    "    -Dman=disabled \\",
    "    -Dhtml=disabled \\",
    "    -Ddbus=enabled \\",
    "    -Dblkid=enabled \\",
    "    -Dkmod=enabled \\",
    "    -Ddefault-hierarchy=unified \\",
    "    -Dsplit-bin=false \\",
    "    -Ddefault-dnssec=no \\",
    "    -Ddefault-mdns=no \\",
    "    -Ddefault-llmnr=no \\",
    "    -Dinstall-sysconfdir=true",
    "DESTDIR=\"$1\" ninja -C . install",
]

[install]
post = []
files = "auto"
backup = []
