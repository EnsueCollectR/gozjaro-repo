[package]
name = "ninja"
version = "1.12.1"
release = 1
depends = ["python3"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/ninja-build/ninja/archive/v$VERSION/ninja-$VERSION.tar.gz", sha256 = "821bdff48a3f683bc4bb3b6f0b5fe7b2d647cf65d52aeb63328c91a6c6df285a" },
]
patches = []

[build]
system = "raw"
steps = [
    "python3 configure.py --bootstrap",
    "install -vm755 ninja \"$DESTDIR/usr/bin/\"",
]

[install]
post = []
files = "auto"
backup = []
