[package]
name = "linux-headers"
version = "7.0"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/kernel/v7.x/linux-$VERSION.tar.xz", sha256 = "bb7f6d80b387c757b7d14bb93028fcb90f793c5c0d367736ee815a100b3891f0" },
]
patches = []

[build]
system = "raw"
steps = [
    "make mrproper",
    "make headers",
    "find usr/include -type f ! -name '*.h' -delete",
    "cp -rv usr/include \"$1/usr/\"",
]

[install]
post = []
files = "auto"
backup = []
